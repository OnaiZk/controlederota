<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sem Conexão - Controle de Frota Eletromidia</title>
  <meta name="theme-color" content="#FF4F00">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #FAFAFA;
      color: #1F2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      background: #FFF0EB;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-container svg {
      width: 36px;
      height: 36px;
      color: #FF4F00;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #6B7280;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #FF4F00;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 79, 0, 0.25);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #E04500;
    }
    .brand {
      margin-top: 24px;
      font-size: 12px;
      font-weight: 600;
      color: #9CA3AF;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 8.5a7 7 0 019.9 0M5 12a11 11 0 014.24-2.8M1.4 15.6a15 15 0 015.35-3.85M12 20h.01M16.24 16.24A4.98 4.98 0 0012 15a4.98 4.98 0 00-2.82.88" />
      </svg>
    </div>
    <h1>Você está offline</h1>
    <p>Verifique sua conexão com a internet para sincronizar dados e continuar utilizando o sistema de Controle de Frota.</p>
    <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
  </div>
  <div class="brand">Eletromidia • Controle de Frota</div>
</body>
</html>
